name: Refresh and publish bin schedule
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: bin-schedule-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh council dates
        env:
          ELMBRIDGE_UPRN: ${{ secrets.ELMBRIDGE_UPRN }}
        run: |
          if [ -n "$ELMBRIDGE_UPRN" ]; then
            python scripts/update-schedule.py
          elif [ "${{ github.event_name }}" != "push" ]; then
            echo "::error::Add the ELMBRIDGE_UPRN repository secret before refreshing."
            exit 1
          else
            echo "Publishing saved schedule; add ELMBRIDGE_UPRN to enable daily refresh."
          fi
      - name: Save validated dates
        run: |
          if ! git diff --quiet -- data/schedule.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/schedule.json
            git commit -m "Refresh council collection dates"
            git push
          fi
      - name: Package public app only
        run: |
          mkdir public
          cp index.html app.js sw.js styles.css manifest.webmanifest CNAME robots.txt .nojekyll public/
          cp -r data icons public/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Publish app
        id: deployment
        uses: actions/deploy-pages@v4
